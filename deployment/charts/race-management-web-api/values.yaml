replicaCount: 1

image:
  repository: bigmission/race-management-web-api
  tag: latest
  pullPolicy: Always

imagePullSecrets: []
nameOverride: ""
fullnameOverride: ""

podAnnotations: {}
podSecurityContext: {}
securityContext: {}

service:
  type: ClusterIP
  port: 8080

ingress:
  enabled: true
  className: nginx
  # Path prefix this service is exposed under on the shared API host. The nginx
  # rewrite strips it, so the app still sees /v1/... and /web-status.
  pathPrefix: race-management
  domain: redmist.racing
  subdomain: api
  environment: prod
  tls: false
  annotations:
    nginx.ingress.kubernetes.io/rewrite-target: /$1
    nginx.ingress.kubernetes.io/ssl-redirect: "false"
    # WebSocket support for the SignalR /web-status hub.
    nginx.ingress.kubernetes.io/proxy-read-timeout: "3600"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "3600"
    nginx.ingress.kubernetes.io/proxy-http-version: "1.1"
    # Consistent hash routing: negotiate + WebSocket upgrade from the same client
    # hit the same pod, preventing SignalR 404s across replicas.
    nginx.ingress.kubernetes.io/upstream-hash-by: "$remote_addr$http_x_forwarded_for"

autoscaling:
  enabled: true
  minReplicas: 1
  maxReplicas: 4
  targetCPUUtilizationPercentage: 80
  targetMemoryUtilizationPercentage: 80

resources:
  requests:
    cpu: "75m"
    memory: "256Mi"
  limits:
    cpu: "500m"
    memory: "512Mi"

serviceAccount:
  create: false
  name: ""
  annotations: {}

nodeSelector: {}
affinity: {}
tolerations: []

# Service-specific env (merged over global.env). Nothing extra required today.
env: {}
