name: Publish Backend Containers

on:
  workflow_dispatch:

jobs:
  extract-version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.get_version.outputs.VERSION }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Extract version from Directory.Build.props
        id: get_version
        run: |
          VERSION=$(grep -oP '<Version>\K[^<]+' Directory.Build.props)
          echo "VERSION=$VERSION" >> $GITHUB_OUTPUT
          echo "Extracted version: $VERSION"

  build-and-push:
    needs: extract-version
    runs-on: ubuntu-latest
    strategy:
      matrix:
        service:
          - name: "Car Gateway"
            dockerfile: "./services/cloud/CarGateway/Dockerfile"
            image: "bigmission/race-management-car-gateway"
          - name: "Channel Processor"
            dockerfile: "./services/cloud/ChannelProcessor/Dockerfile"
            image: "bigmission/race-management-channel-processor"
          - name: "Web API"
            dockerfile: "./services/cloud/WebApi/Dockerfile"
            image: "bigmission/race-management-web-api"

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push ${{ matrix.service.name }}
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ${{ matrix.service.dockerfile }}
          push: true
          cache-from: type=gha
          cache-to: type=gha,mode=max
          tags: |
            ${{ matrix.service.image }}:latest
            ${{ matrix.service.image }}:${{ needs.extract-version.outputs.version }}

  build-summary:
    needs: [extract-version, build-and-push]
    runs-on: ubuntu-latest
    steps:
      - name: Build Summary
        run: |
          echo "Successfully built and pushed all containers with version: ${{ needs.extract-version.outputs.version }}"
          echo "Published containers:"
          echo "  - bigmission/race-management-cargateway:${{ needs.extract-version.outputs.version }}"
          echo "  - bigmission/race-management-channelprocessor:${{ needs.extract-version.outputs.version }}"
          echo "  - bigmission/race-management-webapi:${{ needs.extract-version.outputs.version }}"
