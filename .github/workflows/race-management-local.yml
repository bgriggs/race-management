name: race-management-local

on:
  push:
    branches: [main]
    paths:
      - 'ui/package.json'
      - 'ui/package-lock.json'
      - 'ui/angular.json'
      - 'ui/tsconfig.json'
      - 'ui/race-management-local/**'
      - 'ui/shared-ui/**'
      - '.github/workflows/race-management-local.yml'
  pull_request:
    paths:
      - 'ui/package.json'
      - 'ui/package-lock.json'
      - 'ui/angular.json'
      - 'ui/tsconfig.json'
      - 'ui/race-management-local/**'
      - 'ui/shared-ui/**'
      - '.github/workflows/race-management-local.yml'

jobs:
  build:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: ui
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: ui/package-lock.json

      - name: Pin npm
        run: npm install -g npm@11.16.0

      - name: Install
        run: npm ci

      - name: Build
        run: npm run build:local

      - name: Test
        run: npm run test:local -- --watch=false
