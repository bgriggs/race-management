name: cloud-services

on:
  push:
    branches: [main]
    paths:
      - 'services/**'
      - 'RaceManagementServices.slnx'
      - 'Directory.Build.props'
      - '.github/workflows/cloud-services.yml'
  pull_request:
    paths:
      - 'services/**'
      - 'RaceManagementServices.slnx'
      - 'Directory.Build.props'
      - '.github/workflows/cloud-services.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore
        run: dotnet restore RaceManagementServices.slnx

      - name: Build
        run: dotnet build RaceManagementServices.slnx --configuration Release --no-restore

      - name: Test
        run: dotnet test RaceManagementServices.slnx --configuration Release --no-build --logger "trx;LogFileName=test-results.trx"

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cloud-services-test-results
          path: '**/TestResults/*.trx'
