name: race-management-cloud

on:
  push:
    branches: [main]
    paths:
      - 'ui/race-management-cloud/**'
      - '.github/workflows/race-management-cloud.yml'
  pull_request:
    paths:
      - 'ui/race-management-cloud/**'
      - '.github/workflows/race-management-cloud.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ui/race-management-cloud
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: ui/race-management-cloud/package-lock.json

      - name: Install
        run: npm ci

      - name: Build
        run: npm run build

      - name: Test
        run: npm test -- --watch=false
