name: race-management-cloud

on:
  push:
    branches: [main]
    paths:
      - 'ui/package.json'
      - 'ui/package-lock.json'
      - 'ui/angular.json'
      - 'ui/tsconfig.json'
      - 'ui/race-management-cloud/**'
      - 'ui/shared-ui/**'
      - '.github/workflows/race-management-cloud.yml'
  pull_request:
    paths:
      - 'ui/package.json'
      - 'ui/package-lock.json'
      - 'ui/angular.json'
      - 'ui/tsconfig.json'
      - 'ui/race-management-cloud/**'
      - 'ui/shared-ui/**'
      - '.github/workflows/race-management-cloud.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ui
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: ui/package-lock.json

      - name: Install
        run: npm ci

      - name: Build
        run: npm run build:cloud

      - name: Test
        run: npm run test:cloud -- --watch=false
