<div class="selection-list-controls">
	<input
		#searchInput
		type="text"
		class="search-input"
		placeholder="Search channels..."
		[ngModel]="searchText()"
		(ngModelChange)="searchText.set($event)"
	/>
	<label class="unused-toggle">
		<mat-slide-toggle
			[checked]="showUnusedOnly()"
			(change)="showUnusedOnly.set($event.checked)"
		/>
		<span class="toggle-label">Unused only</span>
	</label>
</div>

<div class="selection-list-table-wrap">
	<table class="selection-list-table">
		<thead>
			<tr>
				<th scope="col">Name</th>
				<th scope="col">Category</th>
				<th scope="col" class="center-column">Used</th>
				<th scope="col">Data Type</th>
				<th scope="col" class="center-column">Reserved</th>
			</tr>
		</thead>
		<tbody>
			@for (channel of filteredChannels(); track channel.id) {
				<tr class="selectable-row" (click)="selectChannel(channel)">
					<td>{{ channel.name }}</td>
					<td>{{ channel.category }}</td>
					<td class="center-cell">
						@if (isUsed(channel.id)) {
							<span class="checkmark">✓</span>
						}
					</td>
					<td>{{ channel.dataType }}</td>
					<td class="center-cell">
						@if (channel.isReserved) {
							<span class="checkmark">✓</span>
						}
					</td>
				</tr>
			} @empty {
				<tr>
					<td colspan="5" class="empty-message">No channels found.</td>
				</tr>
			}
		</tbody>
	</table>
</div>
