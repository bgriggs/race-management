
<div class="channel-selector-field">
	<div class="channel-display channel-display--clickable" (click)="openList()" tabindex="0" role="button" aria-label="Select Channel">
		@if (isReservedSelected()) {
			<span class="material-icons bolt-icon" aria-label="Reserved Channel">bolt</span>
		}
		{{ selectedChannelName() || 'No channel selected' }}
	</div>
	<button type="button" class="select-channel-button icon-button" (click)="openList()" aria-label="Select Channel">
		<span class="material-icons">open_in_new</span>
	</button>
</div>

@if (showList()) {
	<div class="selector-backdrop" (click)="closeList()"></div>
	<div class="selector-popup">
		<div class="selector-popup-header">
			<h3 class="selector-popup-title">Select a Channel</h3>
			<button type="button" class="selector-close-button" (click)="closeList()" aria-label="Close">✕</button>
		</div>
		<lib-channel-selection-list
			[channels]="channels()"
			[usedChannelIds]="usedChannelIds()"
			(channelSelected)="onChannelSelected($event)"
		/>
	</div>
}
