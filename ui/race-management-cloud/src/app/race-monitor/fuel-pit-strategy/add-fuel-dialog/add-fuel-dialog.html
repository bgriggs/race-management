<div class="backdrop" role="presentation" (click)="cancel()"></div>

<div class="dialog" role="dialog" aria-modal="true" aria-labelledby="add-fuel-title">
  <header class="dialog-header">
    <h2 id="add-fuel-title">{{ title() }} — Car #{{ car().number }}</h2>
    <button type="button" class="close-btn" aria-label="Close" (click)="cancel()">&times;</button>
  </header>

  <div class="dialog-body">
    <label class="field">
      <span class="field-label">Fuel added (gallons)</span>
      <input
        type="number"
        min="0.1"
        step="0.1"
        inputmode="decimal"
        [value]="gallons()"
        (input)="onGallonsInput($event)"
        autofocus
      />
    </label>

    @if (!isEnterVolume()) {
      <label class="field">
        <span class="field-label">Time (defaults to now; editable for backdated entries)</span>
        <input
          type="datetime-local"
          [value]="atUtc()"
          (input)="onAtUtcInput($event)"
        />
      </label>
    }

    @if (errorMessage()) {
      <div class="error">{{ errorMessage() }}</div>
    }
  </div>

  <footer class="dialog-footer">
    <button type="button" class="btn secondary" (click)="cancel()" [disabled]="submitting()">Cancel</button>
    <button type="button" class="btn primary" (click)="submit()" [disabled]="!canSubmit()">
      @if (submitting()) { Saving… } @else { Save }
    </button>
  </footer>
</div>
