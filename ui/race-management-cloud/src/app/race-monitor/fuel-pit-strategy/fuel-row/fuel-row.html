<div class="car-tag">#{{ car().number }}</div>

<div class="middle">
  @if (pendingRefuels().length > 0) {
    <ul class="pending-list">
      @for (event of pendingRefuels(); track event.id) {
        <li class="pending-item">
          <span class="pending-text">{{ pendingLabel(event) }} — enter volume:</span>
          <button type="button" class="btn-mini primary" (click)="openEnterVolumeDialog(event)">Enter</button>
          <button type="button" class="btn-mini" (click)="dismissPending(event)">Dismiss</button>
        </li>
      }
    </ul>
  }

  <svg class="gantt" preserveAspectRatio="none" viewBox="0 0 1000 32" width="100%" height="32">
    <rect class="track" x="0" y="6" width="1000" height="20" rx="2" />

    @for (s of renderedStints(); track s.stint.id) {
      <g
        appGanttBar
        [xPct]="s.xPct"
        [widthPct]="s.widthPct"
        [boundary]="s.boundary"
        [confidenceTier]="s.startRefuel?.confidenceTier ?? null"
        [stintLabel]="s.label"
      ></g>
    }

    <line
      class="now"
      [attr.x1]="nowPct() + '%'"
      [attr.x2]="nowPct() + '%'"
      y1="0"
      y2="32"
    />
  </svg>
</div>

<button
  type="button"
  class="readouts"
  title="Open fuel detail"
  (click)="openDetail()"
>
  <span class="readout primary">
    <span class="label">Range</span>
    <span class="value">{{ primaryMinutes() }}</span>
    <span class="sub">{{ primaryGallons() }}</span>
    @if (primaryConfidencePct() !== null) {
      <span class="conf">{{ primaryConfidencePct() }}%</span>
    }
  </span>
  <span class="readout high-conf">
    <span class="label">HC</span>
    <span class="value">{{ highConfMinutes() }}</span>
  </span>
</button>

<button
  type="button"
  class="gas-can-btn"
  title="Record manual refuel"
  aria-label="Record manual refuel for car {{ car().number }}"
  (click)="openManualDialog()"
>⛽</button>

@if (dialogMode(); as mode) {
  <app-add-fuel-dialog
    [teamId]="teamId()"
    [car]="car()"
    [mode]="mode"
    (closed)="closeDialog()"
    (saved)="onDialogSaved()"
  />
}

@if (detailOpen()) {
  <app-fuel-detail-panel
    [teamId]="teamId()"
    [car]="car()"
    [race]="race()"
    (closed)="closeDetail()"
  />
}
