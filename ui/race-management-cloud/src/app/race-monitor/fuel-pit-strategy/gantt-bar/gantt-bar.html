<svg:rect
  [attr.class]="'bar ' + fillClass()"
  [attr.x]="xPct() + '%'"
  [attr.width]="widthPct() + '%'"
  y="6"
  height="20"
  rx="2"
>
  <svg:title>{{ stintLabel() }}</svg:title>
</svg:rect>
@if (icon()) {
  <svg:text
    class="icon"
    [attr.x]="xPct() + '%'"
    y="20"
    dx="3"
  >{{ icon() }}</svg:text>
}
