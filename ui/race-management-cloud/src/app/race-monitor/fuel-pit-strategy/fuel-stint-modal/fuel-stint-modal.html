<div class="backdrop" role="presentation" (click)="cancel()"></div>

<div class="dialog" role="dialog" aria-modal="true" aria-labelledby="stint-modal-title">
  <header class="dialog-header">
    <h2 id="stint-modal-title">{{ title() }} — Car #{{ car().number }}</h2>
    <button type="button" class="close-btn" aria-label="Close" (click)="cancel()">&times;</button>
  </header>

  <div class="dialog-body">
    <label class="field">
      <span class="field-label">Start time</span>
      <input
        type="datetime-local"
        [value]="startAt()"
        (input)="onStartChange($event)"
      />
    </label>

    <label class="field">
      <span class="field-label">End time (optional)</span>
      <input
        type="datetime-local"
        [value]="endAt()"
        (input)="onEndChange($event)"
      />
    </label>

    <div class="field">
      <span class="field-label">Tier</span>
      <div class="radio-group">
        <label class="radio">
          <input
            type="radio"
            name="tier"
            [value]="StintOriginType.Auto"
            [checked]="originType() === StintOriginType.Auto"
            (change)="onTierChange(StintOriginType.Auto)"
          />
          <span>Auto</span>
        </label>
        <label class="radio">
          <input
            type="radio"
            name="tier"
            [value]="StintOriginType.Manual"
            [checked]="originType() === StintOriginType.Manual"
            (change)="onTierChange(StintOriginType.Manual)"
          />
          <span>Manual</span>
        </label>
      </div>
    </div>

    @if (isEdit()) {
      <label class="checkbox">
        <input
          type="checkbox"
          [checked]="noFuelOnPit()"
          (change)="onNoFuelOnPitChange($event)"
        />
        <span>
          No fuel on pit
          <span class="hint">(this is a non-fuel pit stop — merges into previous fuel window)</span>
        </span>
      </label>

      @if (showRefuelField()) {
        <label class="field">
          <span class="field-label">Refuel amount (gallons)</span>
          <input
            type="number"
            min="0.1"
            step="0.1"
            inputmode="decimal"
            [value]="refuelGallons()"
            (input)="onRefuelGallonsChange($event)"
          />
        </label>
      }
    }

    @if (errorMessage()) {
      <div class="error">{{ errorMessage() }}</div>
    }
  </div>

  <footer class="dialog-footer">
    @if (isEdit()) {
      <div class="delete-area">
        @if (deleteWarning(); as w) {
          <div class="warn">{{ w }}</div>
        }
        @if (!confirmDelete()) {
          <button type="button" class="btn danger" (click)="requestDelete()" [disabled]="submitting() || deleting()">Delete</button>
        } @else {
          <span class="confirm-text">Are you sure?</span>
          <button type="button" class="btn danger" (click)="confirmAndDelete()" [disabled]="deleting()">
            @if (deleting()) { Deleting… } @else { Delete }
          </button>
          <button type="button" class="btn secondary" (click)="cancelDelete()" [disabled]="deleting()">Cancel</button>
        }
      </div>
    }
    <div class="primary-actions">
      <button type="button" class="btn secondary" (click)="cancel()" [disabled]="submitting() || deleting()">Cancel</button>
      <button type="button" class="btn primary" (click)="submit()" [disabled]="!canSubmit()">
        @if (submitting()) { Saving… } @else { Save }
      </button>
    </div>
  </footer>
</div>
