<div class="viewport" #viewport>
  <div class="rows">
    <ng-content />
  </div>
  <app-gantt-time-axis
    [sessionStartMs]="sessionStartMs()"
    [sessionEndMs]="sessionEndMs()"
    [canvasWidthPx]="resolvedCanvasWidthPx()"
    [pxPerMinute]="pxPerMinute()"
    [now]="now()"
    [scrollLeft]="scrollLeft()"
    (scrollLeftChange)="setScrollLeft($event)"
  />
</div>
