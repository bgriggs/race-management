<div class="axis-row">
  <div class="left-spacer"></div>
  <div class="canvas-wrap" #wrap (scroll)="onScroll($event)">
    <div class="ticks" [style.width.px]="canvasWidthPx()">
      @for (tick of ticks(); track tick.ms) {
        <span class="tick" [style.left.px]="tick.leftPx">{{ tick.label }}</span>
      }
      @if (nowPx() !== null) {
        <span class="now-label" [style.left.px]="nowPx()!">{{ nowLabel() }}</span>
      }
    </div>
  </div>
  <div class="right-spacer"></div>
</div>
