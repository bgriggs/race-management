@if (drawerOpen()) {
  <div class="drawer-overlay" (click)="closeDrawer()"></div>
}

<nav class="drawer-nav" [class.open]="drawerOpen()" aria-label="Main navigation">
  <a routerLink="/race-monitor" routerLinkActive="active" (click)="closeDrawer()">Race Monitor</a>
  @if (teamSelection.isAdmin()) {
    <a routerLink="/settings" routerLinkActive="active" (click)="closeDrawer()">Settings</a>
  }
</nav>

<header class="top-bar" aria-label="Primary navigation">
  <button class="hamburger" aria-label="Toggle navigation" (click)="toggleDrawer()">
    <span></span>
    <span></span>
    <span></span>
  </button>

  <a class="brand" routerLink="/">RedMist — Race Management</a>

  <nav class="inline-nav" aria-label="Main navigation">
    <a routerLink="/race-monitor" routerLinkActive="active">Race Monitor</a>
    @if (teamSelection.isAdmin()) {
      <a routerLink="/settings" routerLinkActive="active">Settings</a>
    }
  </nav>

  <div class="user-area">
    <button
      class="user-btn"
      aria-haspopup="true"
      [attr.aria-expanded]="userMenuOpen()"
      (click)="toggleUserMenu($event)"
    >
      <span class="user-icon" aria-hidden="true"></span>
      <span class="username">{{ auth.displayName() }}</span>
      <span class="caret" aria-hidden="true"></span>
    </button>

    @if (userMenuOpen()) {
      <ul class="user-dropdown" role="menu">
        @if (auth.isLoggedIn()) {
          <li role="none">
            <button role="menuitem" (click)="auth.logout()">Logout</button>
          </li>
        } @else {
          <li role="none">
            <button role="menuitem" (click)="auth.login()">Login</button>
          </li>
        }
      </ul>
    }
  </div>
</header>
